// GAME BALANCE OPTIONS
// Compensates a smaller team at round start with extra lives (equal team totals)
// and scales respawn delay from the current roster so both teams return players
// at the same rate. Late joiners keep the base lives limit (no extra lives).
// ALL VARIABLES WORK IN RANKED AND UNRANKED MODES
//******************************************************************************
// PLEASE REMEMBER TO UNCOMMENT THE LINES BY REMOVING THE DOUBLE SLASHES (//)
// WHEN CHANGING A VALUE. PLEASE DO NOT UNCOMMENT LINES SET TO DEFAULT VALUES.
//******************************************************************************

// Enable game balance compensation
// 0 = Disabled (default), 1 = Enabled
set scr_gamebalance_enable "0"

// Grant extra lives to the smaller team at round start so team totals match
// 0 = Disabled, 1 = Enabled (default)
// set scr_gamebalance_lives_enable "1"

// Maximum lives a player can receive from compensation
// 0 = Twice the gametype lives limit (default), 1-100 = Hard cap
// set scr_gamebalance_lives_max "0"

// Scale respawn delay from current team roster (stacked team keeps the base delay)
// 0 = Disabled, 1 = Enabled (default)
// set scr_gamebalance_respawn_enable "1"

// Minimum respawn delay in seconds after scaling (ignored when base delay is instant)
// Allowed values: 0-30 (default is 1)
// set scr_gamebalance_respawn_min "1"
