// Enable the ping marker
// Read on map start
// 0 = Disabled
// 1 = Enabled (default)
set scr_pingmarker_enable "1"

// Play the compass direction when the ping misses a sector
// Read on map start
// 0 = Disabled
// 1 = Enabled (default)
set scr_pingmarker_direction_voice "1"

// Post the compass direction in chat when the ping misses a sector
// Read on map start
// 0 = Disabled
// 1 = Enabled (default)
set scr_pingmarker_direction_chat "1"

// Skip the compass direction voice and chat when the ping is closer than this
// Read on map start
// 0 = Always play the direction (default)
// Units, same scale as the 4000 unit ping trace
set scr_pingmarker_direction_mindist "600"

// Play the landmark line when the ping hits a named sector
// Read on map start
// 0 = Disabled
// 1 = Enabled (default)
set scr_pingmarker_landmark_voice "1"

// Post the landmark name in chat when the ping hits a named sector
// Read on map start
// 0 = Disabled
// 1 = Enabled (default)
set scr_pingmarker_landmark_chat "1"
