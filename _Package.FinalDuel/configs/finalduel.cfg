// Enable Final Duel vote (Call Vote menu).
// 0 = Disabled
// 1 = Enabled (default)
set scr_finalduel_enable "1"

// Seconds alive players have to vote.
// Allowed: 5-60 (default 15)
set scr_finalduel_vote_time "15"

// Minimum alive players required to start a vote.
// Allowed: 2-64 (default 2)
set scr_finalduel_min_alive "2"

// Weapon given when the duel starts.
// Default: knife_mp
set scr_finalduel_weapon "knife_mp"

// Clip ammo. Stock is always 0.
// 0 = melee only (default)
// 1+ = limited clip (allowed 0-999)
set scr_finalduel_weapon_ammo "0"

// Enemy highlight on the compass during the duel.
// 0 = Off
// 1 = UAV (default)
// 2 = Force show enemy points
set scr_finalduel_radar "1"

// Round timer when the duel starts (vote does not change the clock).
// Allowed: 10-300 seconds (default 60)
set scr_finalduel_time "60"
